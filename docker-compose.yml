services:
  postgres:
    image: postgres:16
    container_name: pb-postgres
    environment:
      POSTGRES_USER: pb
      POSTGRES_PASSWORD: pb
    ports:
      - "5433:5432"
    volumes:
      - pb_pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pb"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pb_pg_data:
