services:
  postgres:
    image: postgres:16
    container_name: pb-postgres
    environment:
      POSTGRES_USER: pb
      POSTGRES_PASSWORD: pb
    ports:
      - "5433:5432"
    volumes:
      - pb_pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pb"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: pb-auth
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pb_auth
      SPRING_DATASOURCE_USERNAME: pb
      SPRING_DATASOURCE_PASSWORD: pb
    depends_on:
      postgres:
        condition: service_healthy

  scheduling-app:
    build:
      context: .
      dockerfile: scheduling-app/Dockerfile
    container_name: pb-scheduling
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pb_scheduling
      SPRING_DATASOURCE_USERNAME: pb
      SPRING_DATASOURCE_PASSWORD: pb
    depends_on:
      postgres:
        condition: service_healthy

  booking-app:
    build:
      context: .
      dockerfile: booking-app/Dockerfile
    container_name: pb-booking
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pb_booking
      SPRING_DATASOURCE_USERNAME: pb
      SPRING_DATASOURCE_PASSWORD: pb
      PB_BOOKING_SCHEDULING_BASE_URL: http://scheduling-app:8081
    depends_on:
      postgres:
        condition: service_healthy
      scheduling-app:
        condition: service_started

  catalog-app:
    build:
      context: .
      dockerfile: catalog-app/Dockerfile
    container_name: pb-catalog
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pb_catalog
      SPRING_DATASOURCE_USERNAME: pb
      SPRING_DATASOURCE_PASSWORD: pb
    depends_on:
      postgres:
        condition: service_healthy

  gateway-app:
    build:
      context: .
      dockerfile: gateway-app/Dockerfile
    container_name: pb-gateway
    ports:
      - "8080:8080"
    environment:
      PB_GATEWAY_JWT_SECRET: "pb-auth-service-access-secret-change-me-1234567890"
    depends_on:
      auth-service:
        condition: service_started
      scheduling-app:
        condition: service_started
      booking-app:
        condition: service_started
      catalog-app:
        condition: service_started

volumes:
  pb_pg_data:
