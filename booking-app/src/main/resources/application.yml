server:
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: booking-app
  datasource:
    url: jdbc:postgresql://localhost:5433/pb_booking
    username: pb
    password: pb
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: booking
  flyway:
    enabled: true
    schemas: booking
    default-schema: booking
    create-schemas: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

pb:
  booking:
    scheduling-base-url: http://localhost:8081
    hold-expiry-minutes: 15
    expiry-check-interval-ms: 60000
