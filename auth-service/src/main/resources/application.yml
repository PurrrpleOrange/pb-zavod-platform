server:
  port: 8086

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/pb_auth
    username: pb
    password: pb
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    create-schemas: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

auth:
  jwt:
    issuer: auth-service
    access-secret: "pb-auth-service-access-secret-change-me-1234567890"
    access-ttl: 15m
  refresh:
    ttl: 14d
