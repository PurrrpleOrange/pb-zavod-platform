server:
  port: 8080

spring:
  application:
    name: gateway-app
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8086
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<remaining>.*), /${remaining}

        - id: scheduling-app
          uri: http://scheduling-app:8081
          predicates:
            - Path=/scheduling/**
          filters:
            - RewritePath=/scheduling/(?<remaining>.*), /${remaining}

        - id: booking-app
          uri: http://booking-app:8082
          predicates:
            - Path=/booking/**
          filters:
            - RewritePath=/booking/(?<remaining>.*), /${remaining}

        - id: catalog-app
          uri: http://catalog-app:8083
          predicates:
            - Path=/catalog/**
          filters:
            - RewritePath=/catalog/(?<remaining>.*), /${remaining}

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

pb:
  gateway:
    jwt-secret: "pb-auth-service-access-secret-change-me-1234567890"
